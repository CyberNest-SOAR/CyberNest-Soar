services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SURICATA_NIC=${SURICATA_NIC}
    volumes:
      - ./suricata/config/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/var/lib/suricata/rules:rw
      - ./suricata/logs:/var/log/suricata
    command: -i ${SURICATA_NIC}
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.13
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./suricata/logs:/var/log/suricata:rw
      - /home/omen212/soar-project/CyberNest-Soar/siem/wazuh/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - /home/omen212/soar-project/CyberNest-Soar/siem/wazuh/single-node/config/wazuh_indexer_ssl_certs/admin.pem:/etc/ssl/filebeat.pem:ro
      - /home/omen212/soar-project/CyberNest-Soar/siem/wazuh/single-node/config/wazuh_indexer_ssl_certs/admin-key.pem:/etc/ssl/filebeat.key:ro
    environment:
      - output.elasticsearch.ssl.certificate=/etc/ssl/filebeat.pem
      - output.elasticsearch.ssl.key=/etc/ssl/filebeat.key
      - output.elasticsearch.ssl.certificate_authorities=/etc/ssl/root-ca.pem
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: single-node_wazuh
    external: true