services:
  db:
    image: postgres:15
    container_name: soar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soar_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  soar_api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: soar_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      # Core Infrastructure Connections
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soar_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_PREFIX=cybernest
      
      # Ingestion & Credential Configurations
      - GOOGLE_CLIENT_SECRET_FILE=/app/client_secret/client_secret.json
      - GMAIL_SYNC_FOLDER=INBOX
      - GOOGLE_TOKEN_DIR=/app/token_files
      
      # Core ML Classification Models
      - MODEL_ARTIFACT_PATH=/app/artifacts/phishing_model.joblib
      - VECTORIZER_ARTIFACT_PATH=/app/artifacts/tfidf_vectorizer.joblib
      - TRAINING_DATA_PATH=/app/data/data.csv
      
      # OpenSearch Ecosystem
      - OS_HOST=opensearch
      - OS_PORT=9200
      - OS_USER=admin
      - OS_PASS=admin
      
      # RAG & Vector Search Engines
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=cybernest_router
      
      # Local AI Inference Orchestration
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - ROUTING_LLM_MODEL=llama3:8b-instruct
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant_healthcheck:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ../token_files:/app/token_files:rw
      - ../artifacts:/app/artifacts:rw
      - ../data:/app/data:rw
      - ../client_secret:/app/client_secret:ro
      - ../logs:/app/logs:rw

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: soar_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT_API_KEY: ""
    volumes:
      - qdrant_storage:/qdrant/storage

  qdrant_healthcheck:
    image: curlimages/curl:latest
    container_name: soar_qdrant_checker
    # An infinite loop that checks the internal URL. If it fails, this container exits with an error code (1)
    entrypoint: ["/bin/sh", "-c", "while true; do curl -f http://qdrant:6333/readyz || exit 1; sleep 10; done"]
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://qdrant:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: soar_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

volumes:
  postgres_data:
  redis_cache_data:
  qdrant_storage:
  ollama_storage: