services:
  cassandra:
    image: cassandra:4.1
    container_name: thehive-cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=TheHive
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    container_name: thehive-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:9200/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: thehive-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=thehive
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-thehive123}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  cortex.local:
    image: thehiveproject/cortex:4.1.5
    container_name: cortex
    environment:
      - JOB_DIRECTORY=/opt/cortex/jobs
      - CORTEX_INDEX_NAME=cortex_4
      - ES_HOST=http://elasticsearch:9200
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  thehive:
    image: thehiveproject/thehive:5.2.5
    container_name: thehive
    environment:
      - HIVE_FQDN=thehive.local
      - CORTEX_URL=http://cortex:9001
    volumes:
      - thehivedata:/opt/thp/data
    restart: unless-stopped

  misp_mysql:
    image: mysql:8.0
    container_name: misp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:-ChangeMeRoot}
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:-ChangeMeMisp}
    volumes:
      - mispsqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: misp-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  misp.local:
    image: harvarditsecurity/misp:2.4
    container_name: misp-app
    depends_on:
      misp_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: misp_mysql
      DB_PORT: 3306
      DB_NAME: misp
      DB_USER: misp
      DB_PASS: ${MISP_DB_PASSWORD:-ChangeMeMisp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MISP_FQDN: ${MISP_FQDN:-misp.local}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  misp-modules:
    image: harvarditsecurity/misp-modules:latest
    container_name: misp-modules
    restart: unless-stopped

volumes:
  miniodata:
  cassandradata:
  elasticsearchdata:
  thehivedata:
  mispsqldata:
