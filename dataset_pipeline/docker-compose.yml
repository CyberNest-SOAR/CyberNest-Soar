version: "3.8"

services:
  dataset-pipeline:
    build: .
    container_name: soc-dataset-pipeline
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - REAL_DOWNLOADS_ENABLED=false
      - FALLBACK_SYNTHETIC=true
      - TOTAL_EVENTS_TARGET=100000
      - OPENSEARCH_HOST=https://host.docker.internal:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=SecretPassword
    restart: unless-stopped
    networks:
      - dataset-net

networks:
  dataset-net:
    driver: bridge
